<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>院内発熱トレーニング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  :root{
    --bg:#F4F7F7;
    --surface:#FFFFFF;
    --surface-2:#EAF0F0;
    --ink:#132326;
    --ink-soft:#51666C;
    --ink-faint:#8298A0;
    --line:#DAE4E4;
    --primary:#0B6E6E;
    --primary-strong:#084F4F;
    --primary-tint:#E2F1F0;
    --accent:#C1782E;
    --accent-tint:#FBEDDC;
    --good:#2E7D4F;
    --good-tint:#E4F3EA;
    --warn:#C1782E;
    --warn-tint:#FBEDDC;
    --bad:#B23A3A;
    --bad-tint:#FBE7E5;
    --shadow: 0 1px 2px rgba(19,35,38,.06), 0 6px 20px rgba(19,35,38,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1A1C;
      --surface:#152426;
      --surface-2:#1B2C2E;
      --ink:#EAF2F1;
      --ink-soft:#A9BDBF;
      --ink-faint:#71898C;
      --line:#264042;
      --primary:#4FBCB6;
      --primary-strong:#7ED4CE;
      --primary-tint:#193532;
      --accent:#E3A45D;
      --accent-tint:#332615;
      --good:#6FC796;
      --good-tint:#16301F;
      --warn:#E3A45D;
      --warn-tint:#332615;
      --bad:#E27C7C;
      --bad-tint:#3A1B1B;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1A1C;
    --surface:#152426;
    --surface-2:#1B2C2E;
    --ink:#EAF2F1;
    --ink-soft:#A9BDBF;
    --ink-faint:#71898C;
    --line:#264042;
    --primary:#4FBCB6;
    --primary-strong:#7ED4CE;
    --primary-tint:#193532;
    --accent:#E3A45D;
    --accent-tint:#332615;
    --good:#6FC796;
    --good-tint:#16301F;
    --warn:#E3A45D;
    --warn-tint:#332615;
    --bad:#E27C7C;
    --bad-tint:#3A1B1B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.65;
  }
  h1,h2,h3,.disp{
    font-family:"Zen Kaku Gothic New","BIZ UDPGothic",system-ui,sans-serif;
    text-wrap:balance;
    margin:0;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:14px 18px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar .back{
    appearance:none; border:none; background:transparent; color:var(--primary);
    font-size:15px; font-weight:700; cursor:pointer; padding:6px 8px 6px 0;
    display:flex; align-items:center; gap:2px; min-height:44px;
    font-family:inherit;
  }
  .topbar .title{
    font-size:15px; font-weight:700; color:var(--ink-soft);
    letter-spacing:.02em;
    flex:1;
    text-align:center;
    margin-right:34px;
  }
  main{flex:1; padding:0 18px 48px;}

  /* ---------- HOME ---------- */
  .hero{
    padding:28px 4px 18px;
  }
  .hero .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:.14em; color:var(--primary);
    text-transform:uppercase;
  }
  .hero h1{
    font-size:26px; font-weight:900; color:var(--ink); margin-top:8px; line-height:1.4;
  }
  .hero p{
    color:var(--ink-soft); font-size:14px; margin-top:10px; max-width:44ch;
  }
  .progress-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin:14px 0 8px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:16px;
  }
  .progress-ring{ position:relative; width:56px; height:56px; flex:none;}
  .progress-ring svg{ transform:rotate(-90deg); }
  .progress-ring .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--primary-strong);
  }
  .progress-text{flex:1;}
  .progress-text .num{font-size:13px; font-weight:700; color:var(--ink);}
  .progress-text .sub{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
  .review-pill-btn{
    appearance:none; border:1px solid var(--warn); background:var(--warn-tint); color:var(--warn);
    font-weight:700; font-size:12.5px; padding:8px 12px; border-radius:999px; cursor:pointer;
    white-space:nowrap; font-family:inherit;
  }
  .keitai-cta{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--primary-tint); border:1px solid var(--primary); border-radius:16px;
    padding:14px 18px; margin:10px 0 24px; cursor:pointer;
    width:100%; text-align:left; font-family:inherit; appearance:none;
  }
  .keitai-cta .t{display:block; font-size:14px; font-weight:700; color:var(--primary-strong);}
  .keitai-cta .s{display:block; font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .keitai-cta .arrow{color:var(--primary-strong); font-size:18px; flex:none;}

  .section-head{
    display:flex; align-items:baseline; gap:8px; margin:26px 0 12px;
  }
  .section-head .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .section-head.infectious .dot{background:var(--bad);}
  .section-head.noninfectious .dot{background:var(--primary);}
  .section-head h2{font-size:15px; font-weight:700; color:var(--ink);}
  .section-head .count{font-size:12px; color:var(--ink-faint); font-weight:400;}

  .case-grid{ display:flex; flex-direction:column; gap:10px; }
  .case-card{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 14px; cursor:pointer; text-align:left; width:100%;
    box-shadow:var(--shadow); font-family:inherit;
    appearance:none;
  }
  .case-card:active{ transform:scale(.99); }
  .case-num{
    font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:13px;
    color:var(--ink-faint); width:26px; flex:none; font-variant-numeric:tabular-nums;
  }
  .case-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .case-body .hint{
    font-size:14px; font-weight:600; color:var(--ink); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .status-chip{
    flex:none; align-self:flex-start; font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px;
    white-space:nowrap;
  }
  .status-chip.none{ background:var(--surface-2); color:var(--ink-faint); }
  .status-chip.good{ background:var(--good-tint); color:var(--good); }
  .status-chip.partial{ background:var(--warn-tint); color:var(--warn); }
  .status-chip.poor{ background:var(--bad-tint); color:var(--bad); }

  .empty-review{
    text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:14px;
  }

  /* ---------- CASE VIEW ---------- */
  .case-hero{ padding:22px 0 4px; }
  .case-hero .tag{ font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.08em; text-transform:uppercase;}
  .case-hero h1{ font-size:23px; font-weight:900; margin-top:8px; }
  .illustration-wrap{
    background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
    margin-top:16px; box-shadow:var(--shadow);
    overflow:hidden; aspect-ratio:3/2;
    display:flex; align-items:center; justify-content:center;
  }
  .illustration-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .illustration-wrap.img-missing img{ display:none; }
  .illustration-wrap.img-missing::after{
    content:"画像を読み込めませんでした"; font-size:12.5px; color:var(--ink-faint); padding:0 20px; text-align:center;
  }
  .vignette{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:18px 20px; margin-top:16px; box-shadow:var(--shadow); font-size:14.5px; color:var(--ink);
  }
  .vitals-line{
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
    font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .vitals-line b{color:var(--ink); font-weight:700;}

  .prompt-block{ margin-top:22px; }
  .prompt-block label{
    display:block; font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:8px;
  }
  .prompt-block label .n{ color:var(--primary); margin-right:6px; }
  .prompt-block textarea{
    width:100%; min-height:96px; resize:vertical; border-radius:12px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:12px 14px; font-family:inherit; font-size:14px; line-height:1.6;
  }
  .prompt-block textarea:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  .prompt-block textarea::placeholder{ color:var(--ink-faint); }

  .reveal-btn{
    width:100%; margin-top:24px; appearance:none; border:none; cursor:pointer;
    background:var(--primary); color:#fff; font-weight:700; font-size:15px;
    padding:15px; border-radius:14px; font-family:inherit;
    box-shadow:0 4px 14px rgba(11,110,110,.28);
  }
  .reveal-btn:active{ transform:scale(.99); }

  .answer-wrap{ margin-top:28px; }
  .diagnosis-reveal{
    background:var(--primary-tint); border:1.5px solid var(--primary); border-radius:16px;
    padding:18px 20px; margin-bottom:20px; text-align:center;
  }
  .diagnosis-reveal .dr-eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--primary-strong);
  }
  .diagnosis-reveal .dr-title{
    font-family:"Zen Kaku Gothic New","BIZ UDPGothic",sans-serif; font-size:21px; font-weight:900;
    margin-top:6px; color:var(--ink);
  }
  .diagnosis-reveal .dr-sub{ font-size:12.5px; margin-top:6px; color:var(--ink-soft); }
  .answer-wrap .divider{
    display:flex; align-items:center; gap:10px; margin-bottom:18px;
  }
  .answer-wrap .divider .line{ flex:1; height:1px; background:var(--line); }
  .answer-wrap .divider span{ font-size:12px; font-weight:700; color:var(--ink-faint); letter-spacing:.08em;}

  .answer-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:18px 20px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .answer-card h3{
    font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .answer-card h3 .ico{
    width:22px;height:22px;border-radius:7px;flex:none; display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:900; color:#fff;
  }
  .ico.check{background:var(--primary);}
  .ico.danger{background:var(--bad);}
  .ico.tests{background:var(--accent);}
  .answer-card ul{ margin:0; padding-left:20px; font-size:14px; color:var(--ink); }
  .answer-card li{ margin-bottom:6px; }
  .answer-card li:last-child{ margin-bottom:0; }
  mark{
    background:var(--accent-tint); color:var(--accent); padding:1px 5px; border-radius:5px;
    font-weight:700; box-decoration-break:clone; -webkit-box-decoration-break:clone;
  }

  .pearl-block{
    background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin-bottom:20px;
  }
  .pearl-block .pb-label{
    font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--ink-faint);
    text-transform:uppercase; margin-bottom:8px;
  }
  .pearl-block ul{ margin:0; padding-left:18px; font-size:13.5px; color:var(--ink-soft); line-height:1.6; }
  .pearl-block li{ margin-bottom:6px; }
  .pearl-block li:last-child{ margin-bottom:0; }

  .refs-block{
    margin-top:16px; padding-top:14px; border-top:1px dashed var(--line);
  }
  .refs-block h4{
    font-size:12px; font-weight:700; color:var(--ink-faint); letter-spacing:.06em; margin-bottom:8px;
  }
  .refs-block ol{
    margin:0; padding-left:19px; font-size:12.5px; color:var(--ink-soft); line-height:1.6;
  }
  .refs-block li{ margin-bottom:7px; }
  .refs-block li:last-child{ margin-bottom:0; }
  .refs-block a{
    color:var(--ink-soft); text-decoration:underline; text-underline-offset:2px;
    word-break:break-all;
  }
  .refs-block a:hover{ color:var(--primary); }

  .assess-block{ margin-top:26px; }
  .assess-block .q{ font-size:14px; font-weight:700; margin-bottom:12px; text-align:center; }
  .assess-row{ display:flex; gap:8px; }
  .assess-btn{
    flex:1; appearance:none; cursor:pointer; border-radius:12px; padding:13px 6px;
    font-family:inherit; font-size:12.5px; font-weight:700; line-height:1.4;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft);
  }
  .assess-btn.good{ border-color:var(--good); }
  .assess-btn.partial{ border-color:var(--warn); }
  .assess-btn.poor{ border-color:var(--bad); }
  .assess-btn.good.active{ background:var(--good); color:#fff; }
  .assess-btn.partial.active{ background:var(--warn); color:#fff; }
  .assess-btn.poor.active{ background:var(--bad); color:#fff; }
  .save-warning{
    margin-top:12px; padding:10px 14px; border-radius:10px;
    background:var(--bad-tint); color:var(--bad); font-size:12.5px; font-weight:600; line-height:1.5;
  }

  .after-assess{
    margin-top:22px; display:flex; flex-direction:column; gap:10px;
    animation:fadein .3s ease;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .nav-btn{
    appearance:none; border:none; cursor:pointer; border-radius:12px; padding:14px;
    font-family:inherit; font-size:14.5px; font-weight:700; text-align:center;
  }
  .nav-btn.primary{ background:var(--primary); color:#fff; }
  .nav-btn.ghost{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }

  /* ---------- KEITAI (PATTERN) VIEW ---------- */
  .keitai-hero{ padding:24px 0 6px; }
  .keitai-hero .eyebrow{ font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.1em; text-transform:uppercase;}
  .keitai-hero h1{ font-size:22px; font-weight:900; margin-top:8px; }
  .keitai-hero p{ font-size:13.5px; color:var(--ink-soft); margin-top:8px; }

  .escalation-note{
    margin-top:18px; padding:16px 18px; border-radius:14px;
    background:var(--accent-tint); border:1.5px solid var(--accent);
  }
  .escalation-note .en-label{
    font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--accent); text-transform:uppercase;
  }
  .escalation-note .en-body{
    font-size:13.5px; color:var(--ink); margin-top:6px; line-height:1.6;
  }

  .flow{ margin-top:22px; position:relative; }
  .flow-step{
    display:flex; gap:14px; position:relative; padding-bottom:22px;
  }
  .flow-step:last-child{ padding-bottom:0; }
  .flow-step .rail{
    display:flex; flex-direction:column; align-items:center; flex:none;
  }
  .flow-step .node{
    width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px;
    font-family:"Zen Kaku Gothic New",sans-serif; flex:none; z-index:1;
  }
  .flow-step .stem{ width:2px; flex:1; background:var(--line); margin-top:2px; }
  .flow-step .content{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); margin-top:1px;}
  .flow-step .content h3{ font-size:14.5px; font-weight:700; }
  .flow-step .content p{ font-size:13px; color:var(--ink-soft); margin-top:5px; }

  .keitai-foot{
    margin-top:26px; padding:16px 18px; background:var(--primary-tint); border-radius:14px;
    font-size:13px; color:var(--primary-strong); text-align:center; font-weight:700;
  }

  a{color:var(--primary);}
  button:focus-visible, textarea:focus-visible, .case-card:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px;
  }

  @media (hover:hover){
    .case-card:hover{ border-color:var(--primary); }
    .keitai-cta:hover{ background:var(--primary-tint); filter:brightness(0.97); }
    .review-pill-btn:hover{ filter:brightness(0.95); }
    .reveal-btn:hover{ filter:brightness(1.08); }
    .assess-btn:hover{ border-color:var(--primary); }
    .nav-btn.primary:hover{ filter:brightness(1.08); }
    .nav-btn.ghost:hover{ border-color:var(--primary); }
    .topbar .back:hover{ text-decoration:underline; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
  "use strict";

  var CASES = [
    {
      id:"pneumonia", num:1, cat:"infectious", tag:"呼吸器",
      title:"肺炎", hint:"78歳男性・嚥下障害あり・入院5日目の発熱",
      vignette:"78歳男性。脳梗塞後遺症で嚥下障害があり入院中。入院5日目の夜、38.5℃の発熱が出現した。湿性咳嗽と労作時の息切れがある。",
      vitals:"BP 110/70　HR 98　RR 24　SpO2 92%(room air)",
      answer:{
        check:[
          "<mark>SpO2・呼吸数</mark>を含むバイタル全項目",
          "誤嚥の既往・普段の嚥下状態・食事形態",
          "聴診で副雑音の左右差、意識状態の変化"
        ],
        danger:[
          "誤嚥性肺炎からの<mark>急速な呼吸不全</mark>",
          "SpO2低下と意識低下が同時にあれば<mark>敗血症性ショック</mark>への進展を疑う"
        ],
        tests:[
          "胸部X線／CT",
          "喀痰培養（可能なら抗菌薬投与前に）",
          "<mark>低酸素・頻脈など敗血症を疑う所見があり、抗菌薬投与前に血液培養2セット</mark>を提出、酸素投与も並行して開始（肺炎における血液培養の陽性率は一般に低く全例には推奨されないが、重症所見を伴う本症例のような場合は推奨される）"
        ]
      },
      pearl:[
        "入院48時間以降に生じた肺炎は院内肺炎（HAP）に分類され、嚥下障害のある高齢患者では誤嚥が契機になっていることが多い",
        "HAPとしての抗菌薬選択では、耐性菌（MDR）のリスク因子（過去90日以内の静注抗菌薬使用歴、敗血症性ショック、施設のMRSA・緑膿菌の検出状況など）を踏まえて広域さを調整する。IDSA/ATSガイドラインでは、誤嚥性肺炎が疑われるという理由だけで経験的に嫌気性菌カバーを追加することは推奨されていない（肺膿瘍・膿胸を合併している場合を除く）",
        "誤嚥は繰り返しやすいため、解熱後は言語聴覚士によるベッドサイド嚥下評価や食形態調整、ギャッジアップなどの体位管理につなげ、再発予防を初期対応と並行して考える"
      ],
      refs:[
        {author:"Kalil AC, et al.（IDSA/ATS）", title:"Management of Adults With Hospital-Acquired and Ventilator-Associated Pneumonia: 2016 Clinical Practice Guidelines", source:"Clinical Infectious Diseases", year:"2016", url:"https://doi.org/10.1093/cid/ciw353"},
        {author:"Metlay JP, et al.（ATS/IDSA）", title:"Diagnosis and Treatment of Adults with Community-acquired Pneumonia. An Official Clinical Practice Guideline of the American Thoracic Society and Infectious Diseases Society of America", source:"American Journal of Respiratory and Critical Care Medicine", year:"2019", url:"https://doi.org/10.1164/rccm.201908-1581ST"}
      ]
    },
    {

    {t:"抗菌薬", d:"適応があれば早期に投与する。培養提出を優先しつつ、重症なら投与を遅らせない。開始後は培養結果や臨床経過に応じて再評価・狭域化を検討する。"}
  ];

  var STORE_KEY = "hatsunetsu30_progress_v1";
  var DRAFT_KEY = "hatsunetsu30_drafts_v1";

  function loadProgress(){
    try{
      var p = JSON.parse(localStorage.getItem(STORE_KEY));
      return (p && typeof p === "object" && !Array.isArray(p)) ? p : {};
    }catch(e){ return {}; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); return true; }catch(e){ return false; }
  }
  function loadDrafts(){
    try{
      var d = JSON.parse(localStorage.getItem(DRAFT_KEY));
      return (d && typeof d === "object" && !Array.isArray(d)) ? d : {};
    }catch(e){ return {}; }
  }
  function saveDrafts(d){
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); return true; }catch(e){ return false; }
  }

  // Soft data-integrity check: warns in the console (never blocks rendering) if a future
  // edit breaks the id/num invariants that case-card status lookup and case-to-case
  // navigation both rely on.
  (function validateCasesData(){
    var seenIds = {}, seenNums = {}, ok = true;
    CASES.forEach(function(c, i){
      if(seenIds[c.id]) ok = false;
      seenIds[c.id] = true;
      if(seenNums[c.num]) ok = false;
      seenNums[c.num] = true;
      if(c.num !== i+1) ok = false;
    });
    if(!ok && typeof console !== "undefined" && console.warn){
      console.warn("[hatsunetsu] CASES data integrity check failed: ids/nums are not unique and sequential. Case navigation and status tracking may misbehave.");
    }
  })();

  var state = {
    view:"home",          // home | case | keitai
    caseId:null,
    reviewOnly:false,
    progress: loadProgress()
  };

  var lastSaveFailed = false;

  var app = document.getElementById("app");

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  var VALID_STATUSES = ["good","partial","poor"];
  // Whitelists a status value before it is ever concatenated into HTML. state.progress is
  // loaded from localStorage, which a user (or another script sharing the origin) can edit
  // directly — never trust its values enough to treat them as safe HTML/attribute text.
  function safeStatus(s){
    return VALID_STATUSES.indexOf(s) !== -1 ? s : "none";
  }

  function statusLabel(s){
    if(s==="good") return "自力で言えた";
    if(s==="partial") return "一部抜けた";
    if(s==="poor") return "ほぼ言えなかった";
    return "未挑戦";
  }

  function caseById(id){
    for(var i=0;i<CASES.length;i++){ if(CASES[i].id===id) return CASES[i]; }
    return null;
  }

  function completedCount(){
    var n=0;
    for(var i=0;i<CASES.length;i++){ if(state.progress[CASES[i].id]) n++; }
    return n;
  }
  function masteredCount(){
    var n=0;
    for(var i=0;i<CASES.length;i++){ if(state.progress[CASES[i].id]==="good") n++; }
    return n;
  }
  function reviewCases(){
    return CASES.filter(function(c){
      var s = state.progress[c.id];
      return s === "partial" || s === "poor";
    });
  }

  function go(view, caseId){
    state.view = view;
    state.caseId = caseId || null;
    render();
    window.scrollTo(0,0);
  }

  /* ---------------- RENDER: HOME ---------------- */
  function renderHome(){
    var done = completedCount();
    var mastered = masteredCount();
    var total = CASES.length;
    var pct = Math.round(mastered/total*100);
    var rev = reviewCases();

    var circumference = 2*Math.PI*24;
    var offset = circumference * (1 - pct/100);

    var subLine;
    if(done < total){
      subLine = (total-done)+"症例が未挑戦";
    } else if(rev.length){
      subLine = "復習対象が "+rev.length+" 症例あります";
    } else {
      subLine = "全症例クリアです";
    }

    var html = "";
    html += '<div class="hero">';
    html += '  <div class="eyebrow">院内発熱 初動トレーニング</div>';
    html += '  <h1>院内発熱<br>トレーニング</h1>';
    html += '  <p>当直中に出会う院内発熱8症例。答えを見る前に、自分の言葉で「最初に確認すること」「見落とすと危険な病態」「必要な検査・対応」を書き出してみましょう。</p>';
    html += '</div>';

    html += '<div class="progress-card">';
    html += '  <div class="progress-ring"><svg width="56" height="56"><circle cx="28" cy="28" r="24" stroke="var(--surface-2)" stroke-width="5" fill="none"/><circle cx="28" cy="28" r="24" stroke="var(--primary)" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'"/></svg><div class="pct">'+pct+'%</div></div>';
    html += '  <div class="progress-text"><div class="num">'+mastered+' / '+total+' 症例 自力で言えた</div><div class="sub">'+subLine+'</div></div>';
    if(rev.length){
      html += '  <button class="review-pill-btn" data-action="toggle-review">復習</button>';
    }
    html += '</div>';

    html += '<button class="keitai-cta" data-action="goto-keitai"><span><span class="t">院内発熱の「型」を見る</span><span class="s">バイタル→重症度→原因検索→検査→抗菌薬(上級医への相談はいつでも)</span></span><span class="arrow">›</span></button>';

    if(state.reviewOnly){
      html += '<div class="section-head"><span class="dot" style="background:var(--warn)"></span><h2>復習対象の症例</h2><span class="count">'+rev.length+'件</span></div>';
      if(rev.length===0){
        html += '<div class="empty-review">復習対象の症例はありません。<br>「ホームに戻る」から一覧を確認できます。</div>';
      } else {
        html += '<div class="case-grid">'+rev.map(caseCardHtml).join("")+'</div>';
      }
    } else {
      var infectious = CASES.filter(function(c){return c.cat==="infectious";});
      var noninfectious = CASES.filter(function(c){return c.cat==="noninfectious";});
      html += '<div class="section-head infectious"><span class="dot"></span><h2>感染性の原因</h2><span class="count">'+infectious.length+'症例</span></div>';
      html += '<div class="case-grid">'+infectious.map(caseCardHtml).join("")+'</div>';
      html += '<div class="section-head noninfectious"><span class="dot"></span><h2>非感染性の原因</h2><span class="count">'+noninfectious.length+'症例</span></div>';
      html += '<div class="case-grid">'+noninfectious.map(caseCardHtml).join("")+'</div>';
    }

    return html;
  }

  function caseCardHtml(c){
    var status = safeStatus(state.progress[c.id]);
    var numStr = (c.num<10?"0":"")+c.num;
    return '<button class="case-card" data-action="open-case" data-id="'+c.id+'">'+
      '<span class="case-num">'+numStr+'</span>'+
      '<span class="case-body"><span class="hint">'+c.hint+'</span></span>'+
      '<span class="status-chip '+status+'">'+statusLabel(status)+'</span>'+
    '</button>';
  }

  /* ---------------- RENDER: CASE ---------------- */
  var revealCache = {}; // caseId -> bool (revealed) — intentionally session-only (resets each visit)
  var draftCache = loadDrafts(); // caseId -> {check,danger,tests} — persisted to localStorage, debounced
  var pendingStatus = {}; // caseId -> chosen status this session (before/while confirming)

  function renderCase(c){
    var html = "";
    html += '<div class="case-hero"><div class="tag">症例 '+(c.num<10?"0":"")+c.num+'</div><h1>'+c.hint+'</h1></div>';
    html += '<div class="illustration-wrap"><img src="images/'+c.id+'.jpg" alt="'+escapeHtml(c.hint)+'" loading="lazy" data-illustration></div>';
    html += '<div class="vignette">'+c.vignette+'<div class="vitals-line"><b>vitals　</b>'+c.vitals+'</div></div>';

    var revealed = !!revealCache[c.id];
    var drafts = draftCache[c.id] || {};

    html += '<div id="prompts">';
    PROMPTS.forEach(function(p, i){
      html += '<div class="prompt-block">';
      html += '<label><span class="n">'+(i+1)+'.</span>'+p.label+'</label>';
      html += '<textarea data-field="'+p.key+'" placeholder="'+p.ph+'">'+ (drafts[p.key] ? escapeHtml(drafts[p.key]) : "") +'</textarea>';
      html += '</div>';
    });
    html += '</div>';

    if(!revealed){
      html += '<button class="reveal-btn" data-action="reveal">模範解答を見る</button>';
    } else {
      html += renderAnswer(c);
    }

    return html;
  }

  function renderAnswer(c){
    var catLabel = c.cat==="infectious" ? "感染性の原因" : "非感染性の原因";
    var html = '<div class="answer-wrap">';
    html += '<div class="diagnosis-reveal"><div class="dr-eyebrow">正解</div><div class="dr-title">'+c.title+'</div><div class="dr-sub">'+catLabel+'・'+c.tag+'</div></div>';
    html += '<div class="divider"><div class="line"></div><span>模範解答</span><div class="line"></div></div>';

    html += answerCard("check","最初に確認すること", c.answer.check);
    html += answerCard("danger","見落とすと危険な病態", c.answer.danger);
    html += answerCard("tests","必要な検査・対応", c.answer.tests);

    html += renderPearl(c);
    html += renderRefs(c);

    html += '</div>';

    html += '<div class="assess-block">';
    html += '<div class="q">自分の答えと照らし合わせて、自己評価しましょう</div>';
    var cur = pendingStatus[c.id] || state.progress[c.id] || "";
    html += '<div class="assess-row">';
    html += assessBtn("good","自力で言えた", cur);
    html += assessBtn("partial","一部抜けた", cur);
    html += assessBtn("poor","ほぼ言えなかった", cur);
    html += '</div>';
    if(cur && lastSaveFailed){
      html += '<div class="save-warning">⚠ この端末には保存できませんでした。プライベートブラウズ中か、ストレージが無効になっている可能性があります。この記録はこの画面を離れると失われます。</div>';
    }
    html += '</div>';

    if(cur){
      html += '<div class="after-assess">';
      html += '<button class="nav-btn primary" data-action="next-case">次の症例へ</button>';
      html += '<button class="nav-btn ghost" data-action="goto-home">ホームに戻る</button>';
      html += '</div>';
    }

    return html;
  }

  function answerCard(kind, label, items){
    var iconChar = kind==="check" ? "1" : kind==="danger" ? "!" : "2";
    return '<div class="answer-card"><h3><span class="ico '+kind+'">'+iconChar+'</span>'+label+'</h3>'+
      '<ul>'+items.map(function(t){return '<li>'+t+'</li>';}).join("")+'</ul></div>';
  }

  // Optional summary bullets (c.pearl, array of strings) giving background/mechanism beyond
  // the three self-test cards. Omitted entirely if a case has no pearl content.
  function renderPearl(c){
    if(!c.pearl || !c.pearl.length) return "";
    var items = c.pearl.map(function(t){ return '<li>'+t+'</li>'; }).join("");
    return '<div class="pearl-block"><div class="pb-label">まとめ</div><ul>'+items+'</ul></div>';
  }

  // Per-case reference list is optional data (c.refs). Cases without reliable/relevant
  // citations simply omit the field — this renders nothing rather than forcing a section.
  function renderRefs(c){
    if(!c.refs || !c.refs.length) return "";
    var items = c.refs.map(refEntryHtml).join("");
    return '<div class="refs-block"><h4>参考</h4><ol>'+items+'</ol></div>';
  }

  function refEntryHtml(r){
    var citationParts = [];
    if(r.author) citationParts.push(escapeHtml(r.author));
    if(r.title) citationParts.push(escapeHtml(r.title));
    var pub = [];
    if(r.source) pub.push(escapeHtml(r.source));
    if(r.year) pub.push(escapeHtml(String(r.year)));
    if(pub.length) citationParts.push(pub.join(" "));
    var text = citationParts.join("．");
    var linkHtml = "";
    if(r.url){
      linkHtml = '<br><a href="'+escapeHtml(r.url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(r.url)+'</a>';
    }
    return '<li>'+text+linkHtml+'</li>';
  }

  function assessBtn(kind, label, cur){
    return '<button class="assess-btn '+kind+(cur===kind?' active':'')+'" data-action="assess" data-kind="'+kind+'">'+label+'</button>';
  }

  /* ---------------- RENDER: KEITAI ---------------- */
  function renderKeitai(){
    var html = "";
    html += '<div class="keitai-hero"><div class="eyebrow">院内発熱の型</div><h1>どの症例でも、まずこの順番で考える</h1><p>原因が何であれ、院内発熱の初動はこの5ステップが基本の型になります。症例ごとの知識より先に、この流れを体に染み込ませましょう。</p></div>';
    html += '<div class="escalation-note"><div class="en-label">⚡ いつでも・早ければ早いほど</div><div class="en-body">上級医への相談はこの流れの「最後」ではありません。判断に迷う・重症感がある時点で、<mark>抗菌薬を選ぶより先に</mark>共有してください。一人で抱え込まないこと自体が初動の一部です。</div></div>';
    html += '<div class="flow">';
    FLOW.forEach(function(f,i){
      html += '<div class="flow-step">';
      html += '<div class="rail"><div class="node">'+(i+1)+'</div>'+(i<FLOW.length-1?'<div class="stem"></div>':'')+'</div>';
      html += '<div class="content"><h3>'+f.t+'</h3><p>'+f.d+'</p></div>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="keitai-foot">迷ったら、この5つに立ち返る。</div>';
    return html;
  }

  /* ---------------- MASTER RENDER ---------------- */
  function render(){
    var topbarHtml, mainHtml;

    if(state.view==="home"){
      topbarHtml = state.reviewOnly
        ? '<button class="back" data-action="goto-home-full">‹ 一覧</button><div class="title">復習リスト</div>'
        : '<div class="title">院内発熱トレーニング</div>';
      mainHtml = renderHome();
    } else if(state.view==="case"){
      var c = caseById(state.caseId);
      if(!c){
        // Unknown/stale case id (should not happen via normal UI navigation, but never
        // let a bad id crash the whole render — fall back to the home screen instead).
        state.view = "home";
        state.caseId = null;
        return render();
      }
      var numStr = (c.num<10?"0":"")+c.num;
      topbarHtml = '<button class="back" data-action="goto-home">‹ 一覧</button><div class="title">症例 '+numStr+'</div>';
      mainHtml = renderCase(c);
    } else if(state.view==="keitai"){
      topbarHtml = '<button class="back" data-action="goto-home">‹ 一覧</button><div class="title">院内発熱の型</div>';
      mainHtml = renderKeitai();
    }

    app.innerHTML = '<div class="topbar">'+topbarHtml+'</div><main>'+mainHtml+'</main>';
    bindEvents();
  }

  /* ---------------- EVENTS ---------------- */
  // When in review mode, "次の症例へ" should walk the review queue, not the full case list —
  // otherwise the whole point of filtering down to just the cases that need another pass is
  // lost the moment you finish the first one. Falls back to the full list if the review
  // queue is empty (e.g. the case just answered was the last one still needing review).
  function nextCaseAfter(current){
    var pool = state.reviewOnly ? reviewCases() : CASES;
    if(pool.length === 0){ pool = CASES; }
    var idx = -1;
    for(var i=0;i<pool.length;i++){ if(pool[i].id===current.id){ idx = i; break; } }
    return idx === -1 ? pool[0] : pool[(idx+1) % pool.length];
  }

  function bindEvents(){
    app.querySelectorAll("[data-action]").forEach(function(el){
      el.addEventListener("click", function(){
        var action = el.getAttribute("data-action");
        if(action==="open-case"){
          revealCache[el.getAttribute("data-id")] = false;
          delete pendingStatus[el.getAttribute("data-id")];
          lastSaveFailed = false;
          go("case", el.getAttribute("data-id"));
        } else if(action==="goto-home"){
          // Keep whatever reviewOnly state we already had — a user backing out of a case
          // they opened from the review list should land back in the review list, not be
          // silently dropped into the full case list.
          go("home");
        } else if(action==="goto-home-full"){
          state.reviewOnly = false;
          render();
        } else if(action==="toggle-review"){
          state.reviewOnly = true;
          render();
        } else if(action==="goto-keitai"){
          go("keitai");
        } else if(action==="reveal"){
          collectDraft(state.caseId, true);
          revealCache[state.caseId] = true;
          render();
          var wrap = app.querySelector(".answer-wrap");
          if(wrap) wrap.scrollIntoView({behavior:"smooth", block:"start"});
        } else if(action==="assess"){
          var kind = el.getAttribute("data-kind");
          var c0 = caseById(state.caseId);
          if(!c0) return;
          pendingStatus[state.caseId] = kind;
          state.progress[state.caseId] = kind;
          lastSaveFailed = !saveProgress(state.progress);
          render();
        } else if(action==="next-case"){
          var c = caseById(state.caseId);
          if(!c) return;
          var next = nextCaseAfter(c);
          revealCache[next.id] = false;
          delete pendingStatus[next.id];
          go("case", next.id);
        }
      });
    });

    app.querySelectorAll("textarea[data-field]").forEach(function(ta){
      ta.addEventListener("input", function(){
        collectDraft(state.caseId, false);
      });
    });

    app.querySelectorAll("img[data-illustration]").forEach(function(img){
      img.addEventListener("error", function(){
        var wrap = img.closest(".illustration-wrap");
        if(wrap) wrap.classList.add("img-missing");
      }, {once:true});
    });
  }

  var draftSaveTimer = null;
  function collectDraft(caseId, flushNow){
    var d = {};
    app.querySelectorAll("textarea[data-field]").forEach(function(ta){
      d[ta.getAttribute("data-field")] = ta.value;
    });
    draftCache[caseId] = d;
    if(draftSaveTimer){ clearTimeout(draftSaveTimer); draftSaveTimer = null; }
    if(flushNow){
      saveDrafts(draftCache);
    } else {
      draftSaveTimer = setTimeout(function(){ saveDrafts(draftCache); }, 400);
    }
  }
  // Best-effort: flush any pending debounced draft save if the tab is closed/backgrounded
  // before the timer fires (mobile browsers routinely discard backgrounded tabs).
  window.addEventListener("pagehide", function(){ saveDrafts(draftCache); });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") saveDrafts(draftCache);
  });

  render();
})();
</script>
</body>
</html>
